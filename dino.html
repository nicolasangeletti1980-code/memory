<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Cette ligne adapte la page à la largeur du téléphone (pas besoin de zoomer) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4f7b0">
  <title>Memory des Dinos</title>

  <!-- Pour installer le jeu comme une appli sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memory">

  <style>
    /* ===== Les couleurs du jeu (on les change ici, une seule fois) ===== */
    :root {
      --rose: #ff8a2a;          /* orange volcan */
      --rose-clair: #ffe3c4;
      --bleu-clair: #d4f7a8;    /* vert tendre */
      --violet: #2f9e44;        /* vert jungle */
      --violet-fonce: #23521a;  /* vert foncé, pour les textes */
      --blanc: #ffffff;
    }

    /* ===== Réglages généraux ===== */
    * {
      box-sizing: border-box;   /* les tailles incluent les bordures */
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      /* Police arrondie, plus douce pour les enfants */
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      /* Fond dégradé vert, comme une jungle */
      background: linear-gradient(180deg, #f0ffd9 0%, #c8f5a8 55%, #93dc6e 100%);
      color: var(--violet-fonce);
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 100dvh = toute la hauteur visible de l'écran du téléphone */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px;
      overflow-x: hidden;
      /* Empêche la sélection de texte et le zoom par double-tap */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Titre ===== */
    h1 {
      font-size: 1.7rem;
      margin: 4px 0 10px;
      text-align: center;
      line-height: 1.1;
    }

    /* Chaque mot du titre a sa couleur */
    .t-rose   { color: var(--rose); }
    .t-violet { color: var(--violet); }
    .t-bleu   { color: #8a4fd8; }  /* violet */

    /* ===== Barre avec le compteur de coups, le chrono et le record ===== */
    .infos {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 12px;
    }

    .info {
      flex: 1;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 16px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px rgba(47, 120, 40, 0.2);
    }

    .info strong {
      display: block;
      white-space: nowrap;   /* le record reste sur une seule ligne */
      /* taille qui s'adapte : plus petite sur les petits écrans */
      font-size: clamp(0.95rem, 4.6vw, 1.3rem);
      color: var(--rose);
    }

    /* Petit bouton rond pour couper / remettre le son */
    .bouton-son {
      flex: 0 0 46px;
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(47, 120, 40, 0.2);
    }

    /* ===== La grille de cartes ===== */
    .plateau {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 colonnes */
      gap: 10px;
      /* La grille prend la plus petite de ces 3 tailles :
         - la largeur de l'écran moins les marges
         - la hauteur de l'écran moins la place du titre, des infos et du bouton
         - 520 px maximum (pour les tablettes) */
      width: min(100%, 100vh - 260px, 520px);  /* pour les vieux navigateurs */
      width: min(100%, 100dvh - 260px, 520px);
    }

    /* ===== Une carte ===== */
    .carte {
      aspect-ratio: 1 / 1;      /* carte bien carrée */
      perspective: 600px;       /* donne l'effet 3D au retournement */
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* La partie qui tourne (elle contient le dos et la face) */
    .carte-interieur {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }

    /* Quand la carte a la classe "retournee", on la fait pivoter */
    .carte.retournee .carte-interieur {
      transform: rotateY(180deg);
    }

    /* Le dos et la face sont l'un sur l'autre */
    .dos, .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;          /* on ne voit pas l'arrière */
      -webkit-backface-visibility: hidden;
      border: 3px solid var(--blanc);
      box-shadow: 0 4px 10px rgba(47, 120, 40, 0.3);
    }

    /* Dos de la carte : dégradé vert avec des petits pois */
    .dos {
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.3) 2px, transparent 2.5px),
        linear-gradient(135deg, #8fe05a, #2f9e44);
      background-size: 14px 14px, 100% 100%;
    }

    /* L'empreinte de dinosaure au milieu du dos */
    .dos svg {
      width: 42%;
      height: 42%;
    }

    /* Face de la carte (avec le dessin) */
    .face {
      transform: rotateY(180deg);
      padding: 6%;
    }

    .face svg {
      width: 100%;
      height: 100%;
    }

    /* Carte trouvée : contour rose et petit saut de joie */
    .carte.trouvee .face {
      border-color: var(--rose);
      animation: saut 0.5s ease 0.45s;
    }

    @keyframes saut {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50%      { transform: rotateY(180deg) scale(1.12); }
    }

    /* ===== Boutons ===== */
    .bouton {
      margin-top: 14px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: bold;
      padding: 14px 34px;
      border: 3px solid var(--blanc);
      border-radius: 30px;
      background: linear-gradient(135deg, #ffb02e, #ff6b2c);  /* jaune -> orange */
      color: var(--blanc);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(47, 120, 40, 0.4);
    }

    .bouton:active {
      transform: scale(0.95);
    }

    /* ===== Barre du bas : choix du mode + bouton Rejouer ===== */
    .commandes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .commandes .bouton {
      margin-top: 0;
      padding: 12px 24px;
    }

    /* Les deux boutons "Petit" / "Grand" collés l'un à l'autre */
    .modes {
      display: flex;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 30px;
      padding: 3px;
      box-shadow: 0 3px 8px rgba(47, 120, 40, 0.2);
    }

    .mode {
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      min-height: 44px;            /* assez grand pour le doigt */
      padding: 0 16px;
      border: none;
      border-radius: 26px;
      background: none;
      color: var(--violet-fonce);
      cursor: pointer;
    }

    /* Le mode choisi est en bleu clair */
    .mode.actif {
      background: var(--bleu-clair);
      color: var(--violet-fonce);
    }

    /* ===== Petit lien vers l'autre jeu ===== */
    .lien-jeu {
      color: var(--violet-fonce);
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 14px;   /* zone assez grande pour le doigt */
    }

    /* ===== Fenêtre de victoire ===== */
    .victoire {
      position: fixed;
      inset: 0;
      background: rgba(35, 82, 26, 0.45);
      display: none;               /* cachée au départ */
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    /* Quand elle a la classe "visible", on l'affiche */
    .victoire.visible {
      display: flex;
    }

    .victoire-boite {
      background: var(--blanc);
      border: 4px solid var(--rose-clair);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      animation: apparition 0.4s ease;
    }

    @keyframes apparition {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .victoire-boite h2 {
      font-size: 1.7rem;
      margin-bottom: 12px;
      color: var(--rose);
    }

    .victoire-boite p {
      margin: 6px 0;
      font-size: 1.05rem;
    }

    /* Le gros T-rex qui saute au-dessus du message de victoire */
    .trex-victoire {
      width: 130px;
      height: 130px;
      margin: -80px auto 0;
      animation: bondir 0.45s ease-in-out infinite alternate;
    }

    .trex-victoire svg {
      width: 100%;
      height: 100%;
    }

    @keyframes bondir {
      from { transform: translateY(0) rotate(-4deg); }
      to   { transform: translateY(-12px) rotate(4deg); }
    }

    /* Les cartes tremblent quand le T-rex rugit */
    .secousse {
      animation: secousse 0.1s linear 8;
    }

    @keyframes secousse {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(-4px, 2px); }
      75%      { transform: translate(4px, -2px); }
    }

    .record {
      color: var(--violet);
      font-weight: bold;
    }

    /* ===== Confettis (petits cœurs et étoiles qui tombent) ===== */
    .confetti {
      position: fixed;
      top: -40px;
      font-size: 22px;
      pointer-events: none;   /* on peut toucher "à travers" */
      z-index: 20;
      animation: chute linear forwards;
    }

    @keyframes chute {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    /* Si le téléphone demande moins d'animations, on les coupe */
    @media (prefers-reduced-motion: reduce) {
      .carte-interieur { transition: none; }
      .carte.trouvee .face, .victoire-boite, .trex-victoire, .secousse { animation: none; }
      .confetti { display: none; }
    }
  </style>
</head>
<body>

  <h1>
    <span class="t-rose">Memory</span>
    <span class="t-bleu">des</span>
    <span class="t-violet">Dinos</span>
  </h1>

  <!-- Compteur de coups, chrono et meilleur score -->
  <div class="infos">
    <div class="info">Coups<strong id="coups">0</strong></div>
    <div class="info">Temps<strong id="temps">0:00</strong></div>
    <div class="info">Record<strong id="record">–</strong></div>
    <button class="bouton-son" id="bouton-son" aria-label="Couper le son">🔔</button>
  </div>

  <!-- Les cartes seront ajoutées ici par le JavaScript -->
  <div class="plateau" id="plateau"></div>

  <!-- Choix du mode et bouton Rejouer -->
  <div class="commandes">
    <div class="modes">
      <button class="mode" data-mode="petit">Petit</button>
      <button class="mode" data-mode="grand">Grand</button>
    </div>
    <button class="bouton" id="rejouer">Rejouer</button>
  </div>

  <!-- Lien vers la page d'accueil (le choix des jeux) -->
  <a class="lien-jeu" href="index.html">🏠 Choisir un autre jeu</a>

  <!-- Fenêtre qui s'affiche quand on a gagné -->
  <div class="victoire" id="victoire">
    <div class="victoire-boite">
      <div class="trex-victoire" id="trex-victoire"></div>
      <h2>ROAAAR ! Bravo !</h2>
      <p id="resultat"></p>
      <p id="message-record"></p>
      <button class="bouton" id="rejouer-victoire">Rejouer</button>
    </div>
  </div>

  <script>
    // ===================================================================
    // 1. LES DESSINS DES CARTES
    // Chaque dessin est une image "SVG" : des formes simples (cercles,
    // ellipses, traits) décrites dans une boîte de 100 x 100.
    // ===================================================================

    // Petite étoile scintillante, réutilisée sur plusieurs cartes
    function etincelle(x, y, taille, couleur) {
      const t = taille;
      return '<path d="M' + x + ' ' + (y - t) +
        ' Q' + x + ' ' + y + ' ' + (x + t) + ' ' + y +
        ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + t) +
        ' Q' + x + ' ' + y + ' ' + (x - t) + ' ' + y +
        ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - t) + 'Z" fill="' + couleur + '"/>';
    }

    // Astuce de dessin : on dessine les formes une 1re fois en foncé et
    // un peu plus grosses (le contour), puis une 2e fois par-dessus en clair.
    // Résultat : un seul joli contour autour de tout le dinosaure.
    function avecContour(formes, couleur, contour) {
      return '<g fill="' + contour + '" stroke="' + contour + '" stroke-width="5" stroke-linejoin="round">' + formes + '</g>' +
             '<g fill="' + couleur + '">' + formes + '</g>';
    }

    // Un œil avec un petit reflet blanc
    function oeil(x, y, taille) {
      return '<circle cx="' + x + '" cy="' + y + '" r="' + taille + '" fill="#1d2b1a"/>' +
             '<circle cx="' + (x + taille * 0.35) + '" cy="' + (y - taille * 0.35) + '" r="' + (taille * 0.38) + '" fill="#fff"/>';
    }

    // Un petit sourire
    function sourire(x, y, largeur) {
      return '<path d="M' + (x - largeur / 2) + ' ' + y + ' q' + (largeur / 2) + ' ' + (largeur * 0.45) + ' ' + largeur + ' 0" ' +
             'stroke="#1d2b1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    }

    // Une joue rose
    function joue(x, y) {
      return '<ellipse cx="' + x + '" cy="' + y + '" rx="4" ry="2.5" fill="#ff7fa0" opacity="0.6"/>';
    }

    // La liste des 8 cartes du jeu.
    // - id : un nom unique pour reconnaître les paires
    // - nom : ce qui est lu à voix haute par le téléphone (accessibilité)
    // - fond : la couleur pastel de la face de la carte
    // - cri : le bruit du dinosaure quand on trouve la paire
    //         (hauteur : grave si petit nombre, aigu si grand nombre ;
    //          duree : en secondes)
    // - dessin : l'image SVG
    const CARTES = [
      {
        id: "trex", nom: "Un T-rex", fond: "#e4ffd6",
        cri: { hauteur: 110, duree: 0.8 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          avecContour(
            // La queue, le corps, les pattes, le cou et la grosse tête
            '<path d="M30 58 Q14 56 5 70 Q20 68 34 72 Z"/>' +
            '<ellipse cx="42" cy="60" rx="18" ry="16"/>' +
            '<path d="M35 70 h10 v17 h-13 Z"/>' +
            '<path d="M49 70 h10 v17 h-13 Z"/>' +
            '<ellipse cx="53" cy="45" rx="10" ry="12"/>' +
            '<ellipse cx="66" cy="33" rx="22" ry="14"/>',
            "#6cc24a", "#3d8a2a") +
          // Le ventre clair
          '<ellipse cx="47" cy="64" rx="9" ry="9" fill="#c8f08a"/>' +
          // Les piquants sur le dos
          '<path d="M30 46 l3 -7 l4 6 M38 42 l4 -7 l3 7" fill="#ffb02e" stroke="#e07a10" stroke-width="1.5" stroke-linejoin="round"/>' +
          // La grande bouche qui rigole avec ses dents
          '<path d="M68 40 Q78 50 88 37 Z" fill="#b0233a"/>' +
          '<path d="M72 41 l2 4 l2 -4 Z M78 41 l2 4 l2 -4 Z M84 39 l1.5 3.5 l2 -4 Z" fill="#fff"/>' +
          // Le tout petit bras (c'est drôle, les T-rex ont des bras minuscules)
          '<path d="M58 53 q7 1 8 7" stroke="#3d8a2a" stroke-width="4" fill="none" stroke-linecap="round"/>' +
          oeil(62, 28, 4.5) +
          '<circle cx="83" cy="30" r="1.5" fill="#1d2b1a"/>' +
          joue(70, 35) +
          '</svg>'
      },
      {
        id: "triceratops", nom: "Un tricératops", fond: "#fff0dc",
        cri: { hauteur: 170, duree: 0.5 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La grande collerette derrière la tête
          '<circle cx="66" cy="40" r="19" fill="#ffd35c" stroke="#d0661a" stroke-width="2.5"/>' +
          '<circle cx="56" cy="30" r="2.5" fill="#ff8a2a"/><circle cx="66" cy="25" r="2.5" fill="#ff8a2a"/><circle cx="52" cy="40" r="2.5" fill="#ff8a2a"/><circle cx="77" cy="28" r="2.5" fill="#ff8a2a"/>' +
          avecContour(
            '<path d="M24 58 Q10 56 4 64 Q16 66 28 66 Z"/>' +
            '<ellipse cx="42" cy="60" rx="22" ry="15"/>' +
            '<path d="M24 66 h9 v16 h-9 Z M36 68 h9 v15 h-9 Z M48 68 h9 v15 h-9 Z M58 66 h9 v16 h-9 Z"/>' +
            '<ellipse cx="74" cy="54" rx="14" ry="11"/>',
            "#ff9a3c", "#d0661a") +
          // Les trois cornes
          '<path d="M68 46 L71 26 L75 45 Z M78 46 L86 29 L84 49 Z M86 52 L95 46 L90 57 Z" fill="#fff3d0" stroke="#c9a46a" stroke-width="2" stroke-linejoin="round"/>' +
          oeil(74, 51, 3.8) +
          sourire(79, 59, 8) +
          joue(70, 58) +
          '</svg>'
      },
      {
        id: "diplodocus", nom: "Un diplodocus", fond: "#e0f0ff",
        cri: { hauteur: 75, duree: 1 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Le très long cou (trait foncé épais puis trait clair par-dessus)
          '<path d="M56 62 Q66 46 70 22" stroke="#2e6fb5" stroke-width="16" fill="none" stroke-linecap="round"/>' +
          avecContour(
            '<path d="M30 64 Q12 66 3 52 Q12 74 34 76 Z"/>' +
            '<ellipse cx="44" cy="67" rx="20" ry="13"/>' +
            '<path d="M28 72 h8 v14 h-8 Z M38 74 h8 v13 h-8 Z M50 74 h8 v13 h-8 Z M58 72 h8 v14 h-8 Z"/>' +
            '<ellipse cx="76" cy="19" rx="11" ry="8"/>',
            "#5aa8f0", "#2e6fb5") +
          '<path d="M56 62 Q66 46 70 22" stroke="#5aa8f0" stroke-width="11" fill="none" stroke-linecap="round"/>' +
          // Les taches sur le dos
          '<circle cx="36" cy="62" r="3.5" fill="#3f8ad8"/><circle cx="46" cy="58" r="2.5" fill="#3f8ad8"/><circle cx="52" cy="66" r="3" fill="#3f8ad8"/>' +
          oeil(77, 16, 3.2) +
          sourire(82, 22, 6) +
          joue(74, 22) +
          '</svg>'
      },
      {
        id: "stegosaure", nom: "Un stégosaure", fond: "#f0e4ff",
        cri: { hauteur: 140, duree: 0.6 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Les grandes plaques sur le dos
          '<path d="M24 52 L28 36 L35 48 Z M33 47 L40 27 L46 45 Z M45 45 L53 25 L58 46 Z M57 48 L64 33 L67 51 Z" fill="#ff8fc7" stroke="#d6559a" stroke-width="2.5" stroke-linejoin="round"/>' +
          // Les piques au bout de la queue
          '<path d="M10 54 L4 44 L14 52 Z M13 56 L10 46 L17 54 Z" fill="#fff3d0" stroke="#c9a46a" stroke-width="1.5" stroke-linejoin="round"/>' +
          avecContour(
            '<path d="M26 60 Q14 60 8 54 Q12 66 28 68 Z"/>' +
            '<ellipse cx="45" cy="61" rx="23" ry="14"/>' +
            '<path d="M28 68 h9 v15 h-9 Z M40 70 h9 v14 h-9 Z M52 70 h9 v14 h-9 Z M60 67 h9 v15 h-9 Z"/>' +
            '<ellipse cx="77" cy="64" rx="11" ry="8"/>',
            "#a77bf0", "#6c43b8") +
          oeil(78, 61, 3.2) +
          sourire(83, 67, 6) +
          joue(74, 67) +
          '</svg>'
      },
      {
        id: "pteranodon", nom: "Un ptéranodon", fond: "#ffe3ea",
        cri: { hauteur: 650, duree: 0.45 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Les deux grandes ailes
          '<path d="M48 52 L6 34 Q14 50 10 62 Q30 54 48 62 Z" fill="#ffb3c6" stroke="#c43c63" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<path d="M52 52 L94 34 Q86 50 90 62 Q70 54 52 62 Z" fill="#ffb3c6" stroke="#c43c63" stroke-width="2.5" stroke-linejoin="round"/>' +
          // La crête, puis le bec jaune
          '<path d="M50 30 L32 18 L54 26 Z" fill="#ff6f91" stroke="#c43c63" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<path d="M60 32 L86 38 L60 41 Z" fill="#ffd23f" stroke="#d9a400" stroke-width="2" stroke-linejoin="round"/>' +
          avecContour(
            '<ellipse cx="50" cy="60" rx="9" ry="14"/>' +
            '<ellipse cx="56" cy="34" rx="10" ry="9"/>' +
            '<path d="M44 72 l-3 10 l6 -2 Z M56 72 l3 10 l-6 -2 Z"/>',
            "#ff6f91", "#c43c63") +
          oeil(56, 31, 3.5) +
          joue(52, 39) +
          '</svg>'
      },
      {
        id: "ankylosaure", nom: "Un ankylosaure", fond: "#fff6d6",
        cri: { hauteur: 120, duree: 0.55 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La queue avec sa grosse massue au bout
          '<path d="M26 64 Q18 64 16 57" stroke="#a8741a" stroke-width="9" fill="none" stroke-linecap="round"/>' +
          '<path d="M26 64 Q18 64 16 57" stroke="#e8b04a" stroke-width="5" fill="none" stroke-linecap="round"/>' +
          avecContour(
            '<ellipse cx="13" cy="53" rx="7" ry="6"/>' +
            // Le dos tout bosselé comme une armure
            '<ellipse cx="46" cy="62" rx="26" ry="14"/>' +
            '<circle cx="28" cy="54" r="6"/><circle cx="38" cy="49" r="6"/><circle cx="50" cy="48" r="6"/><circle cx="61" cy="51" r="6"/>' +
            '<path d="M28 70 h9 v13 h-9 Z M40 72 h9 v12 h-9 Z M52 72 h9 v12 h-9 Z M62 70 h9 v13 h-9 Z"/>' +
            '<ellipse cx="78" cy="64" rx="11" ry="9"/>',
            "#e8b04a", "#a8741a") +
          // Les petites bosses plus foncées
          '<circle cx="28" cy="54" r="2.5" fill="#c98a2a"/><circle cx="38" cy="49" r="2.5" fill="#c98a2a"/>' +
          '<circle cx="50" cy="48" r="2.5" fill="#c98a2a"/><circle cx="61" cy="51" r="2.5" fill="#c98a2a"/>' +
          '<circle cx="40" cy="62" r="2" fill="#c98a2a"/><circle cx="52" cy="60" r="2" fill="#c98a2a"/>' +
          oeil(79, 61, 3.4) +
          sourire(84, 68, 6) +
          joue(75, 68) +
          '</svg>'
      },
      {
        id: "bebe", nom: "Un bébé dinosaure dans son œuf", fond: "#e6ffe0",
        cri: { hauteur: 520, duree: 0.3 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La tête du bébé qui sort de l'œuf
          '<circle cx="50" cy="44" r="19" fill="#8fe05a" stroke="#4f9e2a" stroke-width="2.5"/>' +
          '<circle cx="42" cy="58" r="2" fill="#4f9e2a"/>' +
          oeil(43, 42, 5) + oeil(58, 42, 5) +
          '<path d="M44 52 Q51 59 58 52 Z" fill="#b0233a"/>' +
          '<path d="M47 52.5 l1.5 3 l1.5 -3 Z" fill="#fff"/>' +
          joue(37, 50) + joue(64, 50) +
          // Le morceau de coquille posé sur la tête comme un chapeau
          '<path d="M37 31 L41 25 L45 30 L50 24 L55 30 L59 25 L63 31 Q58 20 50 19 Q42 20 37 31 Z" fill="#fff4d6" stroke="#c9a46a" stroke-width="2" stroke-linejoin="round"/>' +
          // Le bas de l'œuf cassé, avec ses taches
          '<path d="M24 60 L30 54 L36 60 L42 53 L48 60 L54 53 L60 60 L66 53 L72 60 L77 56 Q80 90 50 91 Q20 90 24 60 Z" fill="#fff4d6" stroke="#c9a46a" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<circle cx="36" cy="74" r="3.5" fill="#b8e6ff"/><circle cx="60" cy="80" r="4" fill="#b8e6ff"/><circle cx="66" cy="68" r="2.5" fill="#b8e6ff"/>' +
          // Les petites mains accrochées au bord
          '<circle cx="34" cy="58" r="4" fill="#8fe05a" stroke="#4f9e2a" stroke-width="2"/>' +
          '<circle cx="66" cy="58" r="4" fill="#8fe05a" stroke="#4f9e2a" stroke-width="2"/>' +
          '</svg>'
      },
      {
        id: "volcan", nom: "Un volcan rigolo", fond: "#ffe6dc",
        cri: { hauteur: 50, duree: 1 },
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La fumée et les boules de lave qui sautent
          '<circle cx="40" cy="16" r="8" fill="#d9d9e3"/><circle cx="52" cy="10" r="9" fill="#e6e6ee"/><circle cx="63" cy="17" r="7" fill="#d9d9e3"/>' +
          '<circle cx="30" cy="28" r="4" fill="#ff5a2a"/><circle cx="72" cy="26" r="4.5" fill="#ffb02e"/><circle cx="50" cy="24" r="3.5" fill="#ffd23f"/>' +
          // La montagne
          '<path d="M12 90 L38 36 L62 36 L88 90 Z" fill="#b8734a" stroke="#7a4426" stroke-width="2.5" stroke-linejoin="round"/>' +
          // La lave qui coule du sommet
          '<path d="M38 36 L62 36 L60 44 Q57 40 55 50 Q52 41 49 48 Q46 40 43 46 Q41 40 38 36 Z" fill="#ff5a2a" stroke="#c43c1a" stroke-width="2" stroke-linejoin="round"/>' +
          // Le visage du volcan
          oeil(42, 62, 4) + oeil(58, 62, 4) +
          '<path d="M41 71 Q50 81 59 71 Z" fill="#7a2a1a"/>' +
          joue(35, 70) + joue(65, 70) +
          '</svg>'
      }
    ];

    // L'empreinte de dinosaure dessinée au dos de chaque carte
    const DESSIN_DOS =
      '<svg viewBox="0 0 100 100" fill="#fff" opacity="0.9">' +
      '<ellipse cx="50" cy="66" rx="20" ry="17"/>' +
      '<ellipse cx="28" cy="36" rx="7" ry="13" transform="rotate(-25 28 36)"/>' +
      '<ellipse cx="50" cy="26" rx="7" ry="14"/>' +
      '<ellipse cx="72" cy="36" rx="7" ry="13" transform="rotate(25 72 36)"/>' +
      '</svg>';

    // Noms utilisés pour ranger les infos dans la mémoire du téléphone
    const CLE_RECORD = "memory-dino-record";   // meilleur score
    const CLE_MODE = "memory-dino-mode";       // dernier mode choisi
    const CLE_SON = "memory-dino-son";         // son activé ou non

    // Les deux modes de jeu : le nombre de paires sur le plateau
    // Petit = 6 paires (12 cartes), Grand = 8 paires (16 cartes)
    const MODES = { petit: 6, grand: 8 };

    // ===================================================================
    // 2. On récupère les éléments de la page
    // ===================================================================
    const plateau = document.getElementById("plateau");
    const affichageCoups = document.getElementById("coups");
    const affichageTemps = document.getElementById("temps");
    const affichageRecord = document.getElementById("record");
    const fenetreVictoire = document.getElementById("victoire");
    const texteResultat = document.getElementById("resultat");
    const texteRecord = document.getElementById("message-record");

    // ===================================================================
    // 3. Les variables qui changent pendant la partie
    // ===================================================================
    let premiereCarte = null;   // la 1re carte retournée
    let deuxiemeCarte = null;   // la 2e carte retournée
    let bloque = false;         // true = on attend, on ne peut pas toucher
    let coups = 0;              // nombre de coups joués
    let pairesTrouvees = 0;     // nombre de paires trouvées
    let secondes = 0;           // temps écoulé
    let chrono = null;          // le minuteur (null = arrêté)
    let attente = null;         // le délai en cours (retournement ou victoire)
    let nombrePaires = 8;       // nombre de paires de la partie en cours

    // ===================================================================
    // 4. Mélanger un tableau (méthode de Fisher-Yates)
    // On parcourt le tableau de la fin vers le début
    // et on échange chaque case avec une case au hasard avant elle.
    // ===================================================================
    function melanger(tableau) {
      for (let i = tableau.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
      }
      return tableau;
    }

    // ===================================================================
    // 5. Transformer des secondes en texte "m:ss"
    // ===================================================================
    function formaterTemps(total) {
      const minutes = Math.floor(total / 60);
      const sec = total % 60;
      // padStart ajoute un 0 devant si besoin (ex : 5 -> "05")
      return minutes + ":" + String(sec).padStart(2, "0");
    }

    // ===================================================================
    // 6. La mémoire du téléphone (record, mode, son)
    // On utilise "localStorage" : une petite mémoire du navigateur
    // qui reste sur le téléphone même après fermeture.
    // try/catch évite que le jeu plante si cette mémoire est bloquée.
    // ===================================================================
    function lireMemoire(cle) {
      try {
        return localStorage.getItem(cle);
      } catch (e) {
        return null;
      }
    }

    function ecrireMemoire(cle, valeur) {
      try {
        localStorage.setItem(cle, valeur);
      } catch (e) {
        // Pas grave : l'info ne sera simplement pas gardée
      }
    }

    // On reprend le dernier mode choisi (Grand si rien n'est enregistré)
    let mode = lireMemoire(CLE_MODE) === "petit" ? "petit" : "grand";

    // Chaque mode a son propre record
    function cleRecord() {
      return mode === "grand" ? CLE_RECORD : CLE_RECORD + "-petit";
    }

    function lireRecord() {
      const texte = lireMemoire(cleRecord());
      try {
        return texte ? JSON.parse(texte) : null;
      } catch (e) {
        return null;
      }
    }

    function sauverRecord(record) {
      ecrireMemoire(cleRecord(), JSON.stringify(record));
    }

    function afficherRecord() {
      const record = lireRecord();
      if (record) {
        affichageRecord.textContent = record.coups + " coups";
      } else {
        affichageRecord.textContent = "–";
      }
    }

    // ===================================================================
    // 7. Le chronomètre
    // ===================================================================
    function demarrerChrono() {
      // setInterval lance une fonction toutes les 1000 ms (= 1 seconde)
      chrono = setInterval(function () {
        secondes++;
        affichageTemps.textContent = formaterTemps(secondes);
      }, 1000);
    }

    function arreterChrono() {
      clearInterval(chrono);
      chrono = null;
    }

    // ===================================================================
    // 7 bis. Les cris de dinosaures
    // Aucun fichier son : le téléphone fabrique lui-même les notes
    // grâce à "Web Audio" (un petit synthétiseur intégré au navigateur).
    // ===================================================================
    let audio = null;                              // le synthétiseur
    let sonActif = lireMemoire(CLE_SON) !== "non"; // son activé par défaut
    const boutonSon = document.getElementById("bouton-son");

    // Le synthétiseur ne peut démarrer qu'après un toucher de l'écran :
    // on le prépare donc au premier toucher de carte.
    function preparerAudio() {
      if (audio === null) {
        const Synthe = window.AudioContext || window.webkitAudioContext;
        if (!Synthe) {
          return null;   // navigateur trop ancien : on joue sans son
        }
        audio = new Synthe();
      }
      if (audio.state === "suspended") {
        audio.resume();
      }
      return audio;
    }

    // Un "souffle" (du bruit, comme "chhhh") fabriqué une seule fois
    // puis réutilisé dans chaque rugissement.
    let souffle = null;
    function fabriquerSouffle() {
      if (souffle === null) {
        souffle = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const donnees = souffle.getChannelData(0);
        for (let i = 0; i < donnees.length; i++) {
          donnees[i] = Math.random() * 2 - 1;   // des valeurs au hasard = du bruit
        }
      }
      return souffle;
    }

    // Une "saturation" qui rend le son plus rauque, plus sauvage
    function fabriquerSaturation() {
      const saturation = audio.createWaveShaper();
      const courbe = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const x = i / 128 - 1;
        courbe[i] = Math.tanh(x * 4);
      }
      saturation.curve = courbe;
      return saturation;
    }

    // Joue UN rugissement de dinosaure.
    // - debut : dans combien de secondes il commence
    // - duree : combien de temps il dure
    // - hauteur : grave (petit nombre) ou aigu (grand nombre)
    // - volume : de 0 (muet) à 1 (très fort)
    function rugissement(debut, duree, hauteur, volume) {
      const t = audio.currentTime + debut;

      // 1) La voix : une note "en dents de scie" (son rauque)
      //    qui monte un peu puis redescend, comme un cri
      const voix = audio.createOscillator();
      voix.type = "sawtooth";
      voix.frequency.setValueAtTime(hauteur * 0.8, t);
      voix.frequency.exponentialRampToValueAtTime(hauteur * 1.3, t + duree * 0.25);
      voix.frequency.exponentialRampToValueAtTime(hauteur * 0.6, t + duree);

      // 2) Le souffle de la gorge
      const bruit = audio.createBufferSource();
      bruit.buffer = fabriquerSouffle();
      bruit.loop = true;
      const volumeBruit = audio.createGain();
      volumeBruit.gain.value = 0.5;

      // 3) Un filtre qui garde surtout les sons graves (= gros animal)
      const filtre = audio.createBiquadFilter();
      filtre.type = "lowpass";
      filtre.frequency.value = hauteur * 6;
      filtre.Q.value = 3;

      // 4) Le volume qui tremble très vite : c'est le "grrrr"
      const grr = audio.createOscillator();
      grr.frequency.value = 30;
      const forceGrr = audio.createGain();
      forceGrr.gain.value = 0.4;
      const tremblement = audio.createGain();
      tremblement.gain.value = 0.6;
      grr.connect(forceGrr);
      forceGrr.connect(tremblement.gain);

      // 5) Le volume général : monte vite, tient, puis s'éteint
      const enveloppe = audio.createGain();
      enveloppe.gain.setValueAtTime(0.0001, t);
      enveloppe.gain.exponentialRampToValueAtTime(volume, t + 0.06);
      enveloppe.gain.setValueAtTime(volume, t + duree * 0.6);
      enveloppe.gain.exponentialRampToValueAtTime(0.0001, t + duree);

      // On branche tout : voix + souffle -> filtre -> saturation -> grrr -> volume -> haut-parleur
      const saturation = fabriquerSaturation();
      voix.connect(filtre);
      bruit.connect(volumeBruit);
      volumeBruit.connect(filtre);
      filtre.connect(saturation);
      saturation.connect(tremblement);
      tremblement.connect(enveloppe);
      enveloppe.connect(audio.destination);

      [voix, bruit, grr].forEach(function (source) {
        source.start(t);
        source.stop(t + duree + 0.1);
      });
    }

    // Paire trouvée : le dinosaure de la carte pousse son cri
    function sonPaire(id) {
      if (!sonActif || !preparerAudio()) return;
      // On cherche la carte qui a cet id pour connaître son cri
      const modele = CARTES.find(function (c) { return c.id === id; }) || CARTES[0];
      rugissement(0, modele.cri.duree, modele.cri.hauteur, 0.25);
    }

    // Victoire : le GRAND rugissement du T-rex !
    // (deux rugissements mélangés, un grave et un plus aigu, pour un cri énorme)
    function sonVictoire() {
      if (!sonActif || !preparerAudio()) return;
      rugissement(0, 1.9, 90, 0.35);
      rugissement(0.05, 1.7, 150, 0.2);
    }

    // Le bouton du son (🔔) : couper ou remettre le son
    function afficherBoutonSon() {
      boutonSon.textContent = sonActif ? "🔔" : "🔕";
      boutonSon.setAttribute("aria-label", sonActif ? "Couper le son" : "Remettre le son");
    }

    boutonSon.addEventListener("click", function () {
      sonActif = !sonActif;
      ecrireMemoire(CLE_SON, sonActif ? "oui" : "non");
      afficherBoutonSon();
      sonPaire();   // petit son pour confirmer que c'est remis
    });

    afficherBoutonSon();

    // ===================================================================
    // 8. Créer une nouvelle partie
    // ===================================================================
    function nouvellePartie() {
      // On remet tout à zéro
      arreterChrono();
      clearTimeout(attente);    // annule un retournement encore en attente
      premiereCarte = null;
      deuxiemeCarte = null;
      bloque = false;
      coups = 0;
      pairesTrouvees = 0;
      secondes = 0;
      affichageCoups.textContent = "0";
      affichageTemps.textContent = "0:00";
      fenetreVictoire.classList.remove("visible");
      // On enlève les confettis qui tomberaient encore
      document.querySelectorAll(".confetti").forEach(function (c) { c.remove(); });
      afficherRecord();

      // On allume le bouton du mode choisi (Petit ou Grand)
      document.querySelectorAll(".mode").forEach(function (bouton) {
        bouton.classList.toggle("actif", bouton.dataset.mode === mode);
      });

      // On tire au hasard les dessins de la partie
      // (en mode Petit, 6 dessins sur les 8)
      nombrePaires = MODES[mode];
      const choix = melanger([...CARTES]).slice(0, nombrePaires);

      // On double la liste des cartes (pour faire les paires) et on mélange
      const paquet = melanger([...choix, ...choix]);

      // On vide le plateau puis on crée les 16 cartes
      plateau.innerHTML = "";
      paquet.forEach(function (modele) {
        const carte = document.createElement("button");
        carte.className = "carte";
        carte.dataset.id = modele.id;   // on garde l'identité "cachée" dans la carte
        carte.dataset.nom = modele.nom;
        carte.setAttribute("aria-label", "Carte cachée");
        carte.innerHTML =
          '<div class="carte-interieur">' +
            '<div class="dos">' + DESSIN_DOS + '</div>' +
            '<div class="face" style="background:' + modele.fond + '">' + modele.dessin + '</div>' +
          '</div>';
        carte.addEventListener("click", function () {
          toucherCarte(carte);
        });
        plateau.appendChild(carte);
      });
    }

    // ===================================================================
    // 9. Quand on touche une carte
    // ===================================================================
    function toucherCarte(carte) {
      // On ignore le toucher si :
      // - on attend que deux cartes se retournent
      // - la carte est déjà retournée ou déjà trouvée
      if (bloque || carte.classList.contains("retournee")) {
        return;
      }

      // On réveille le synthétiseur (il a besoin d'un toucher pour démarrer)
      if (sonActif) {
        preparerAudio();
      }

      // Le chrono démarre au tout premier toucher
      if (chrono === null && secondes === 0) {
        demarrerChrono();
      }

      // On retourne la carte (le CSS fait l'animation)
      carte.classList.add("retournee");
      carte.setAttribute("aria-label", carte.dataset.nom);

      if (premiereCarte === null) {
        // C'est la 1re carte du coup : on la garde en mémoire
        premiereCarte = carte;
        return;
      }

      // C'est la 2e carte : un coup est terminé
      deuxiemeCarte = carte;
      coups++;
      affichageCoups.textContent = coups;

      if (premiereCarte.dataset.id === deuxiemeCarte.dataset.id) {
        // Les deux cartes sont identiques : elles restent visibles
        premiereCarte.classList.add("trouvee");
        deuxiemeCarte.classList.add("trouvee");
        pairesTrouvees++;
        premiereCarte = null;
        deuxiemeCarte = null;

        // Toutes les paires trouvées ? C'est gagné !
        if (pairesTrouvees === nombrePaires) {
          sonVictoire();
          victoire();
        } else {
          sonPaire(carte.dataset.id);   // le cri du dinosaure trouvé
        }
      } else {
        // Pas identiques : on bloque, puis on les retourne après 1 seconde
        bloque = true;
        attente = setTimeout(function () {
          premiereCarte.classList.remove("retournee");
          deuxiemeCarte.classList.remove("retournee");
          premiereCarte.setAttribute("aria-label", "Carte cachée");
          deuxiemeCarte.setAttribute("aria-label", "Carte cachée");
          premiereCarte = null;
          deuxiemeCarte = null;
          bloque = false;
        }, 1000);
      }
    }

    // ===================================================================
    // 10. Pluie de confettis (dinosaures, œufs, volcans) quand on gagne
    // ===================================================================
    function lancerConfettis() {
      const symboles = ["🦖", "🦕", "🥚", "🌋", "⭐"];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement("span");
        c.className = "confetti";
        c.textContent = symboles[i % symboles.length];
        c.style.left = Math.random() * 100 + "vw";                 // position au hasard
        c.style.animationDuration = 2 + Math.random() * 2 + "s";   // vitesse au hasard
        c.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(c);
        // On l'enlève de la page quand il a fini de tomber
        c.addEventListener("animationend", function () { c.remove(); });
      }
    }

    // ===================================================================
    // 11. Fin de partie
    // ===================================================================
    function victoire() {
      arreterChrono();

      // Le plateau tremble pendant le rugissement du T-rex
      plateau.classList.add("secousse");
      setTimeout(function () { plateau.classList.remove("secousse"); }, 900);

      // On met le dessin du T-rex dans la fenêtre de victoire
      document.getElementById("trex-victoire").innerHTML = CARTES[0].dessin;

      texteResultat.textContent =
        "Gagné en " + coups + " coups et " + formaterTemps(secondes) + ".";

      // Meilleur score = le moins de coups.
      // En cas d'égalité, le temps le plus court gagne.
      const ancien = lireRecord();
      const nouveauRecord =
        ancien === null ||
        coups < ancien.coups ||
        (coups === ancien.coups && secondes < ancien.secondes);

      if (nouveauRecord) {
        sauverRecord({ coups: coups, secondes: secondes });
        texteRecord.innerHTML = '<span class="record">🏆 Nouveau record !</span>';
      } else {
        texteRecord.textContent =
          "Record : " + ancien.coups + " coups en " + formaterTemps(ancien.secondes);
      }

      afficherRecord();

      // Petite pause pour laisser finir l'animation de la dernière carte
      attente = setTimeout(function () {
        fenetreVictoire.classList.add("visible");
        lancerConfettis();
      }, 800);
    }

    // ===================================================================
    // 12. Les boutons "Rejouer"
    // ===================================================================
    document.getElementById("rejouer").addEventListener("click", nouvellePartie);
    document.getElementById("rejouer-victoire").addEventListener("click", nouvellePartie);

    // Les boutons "Petit" et "Grand" : on change de mode et on relance
    document.querySelectorAll(".mode").forEach(function (bouton) {
      bouton.addEventListener("click", function () {
        mode = bouton.dataset.mode;
        ecrireMemoire(CLE_MODE, mode);
        nouvellePartie();
      });
    });

    // ===================================================================
    // 13. On lance la première partie au chargement de la page
    // ===================================================================
    nouvellePartie();
    // ===================================================================
    // 14. Le mode appli : une copie du jeu est gardée dans le téléphone
    // pour pouvoir jouer même sans internet (voir le fichier sw.js)
    // ===================================================================
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
</body>
