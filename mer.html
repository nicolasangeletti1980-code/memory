<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Cette ligne adapte la page à la largeur du téléphone (pas besoin de zoomer) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bdf0ff">
  <title>Memory de la Mer</title>

  <style>
    /* ===== Les couleurs du jeu (on les change ici, une seule fois) ===== */
    :root {
      --rose: #ff7f50;          /* corail */
      --rose-clair: #ffe0d6;
      --bleu-clair: #b8f0ff;
      --violet: #1e88c7;        /* bleu océan */
      --violet-fonce: #0b3d63;  /* bleu nuit, pour les textes */
      --blanc: #ffffff;
    }

    /* ===== Réglages généraux ===== */
    * {
      box-sizing: border-box;   /* les tailles incluent les bordures */
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      /* Police arrondie, plus douce pour les enfants */
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      /* Fond dégradé du ciel clair vers l'océan */
      background: linear-gradient(180deg, #d6f7ff 0%, #8fdcf7 55%, #4fb8e8 100%);
      color: var(--violet-fonce);
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 100dvh = toute la hauteur visible de l'écran du téléphone */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px;
      overflow-x: hidden;
      /* Empêche la sélection de texte et le zoom par double-tap */
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Titre ===== */
    h1 {
      font-size: 1.7rem;
      margin: 4px 0 10px;
      text-align: center;
      line-height: 1.1;
    }

    /* Chaque mot du titre a sa couleur */
    .t-rose   { color: var(--rose); }
    .t-violet { color: var(--violet); }
    .t-bleu   { color: #2ec4b6; }  /* turquoise */

    /* ===== Barre avec le compteur de coups, le chrono et le record ===== */
    .infos {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 12px;
    }

    .info {
      flex: 1;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 16px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px rgba(30, 110, 180, 0.2);
    }

    .info strong {
      display: block;
      white-space: nowrap;   /* le record reste sur une seule ligne */
      /* taille qui s'adapte : plus petite sur les petits écrans */
      font-size: clamp(0.95rem, 4.6vw, 1.3rem);
      color: var(--rose);
    }

    /* Petit bouton rond pour couper / remettre le son */
    .bouton-son {
      flex: 0 0 46px;
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(30, 110, 180, 0.2);
    }

    /* ===== La grille de cartes ===== */
    .plateau {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 colonnes */
      gap: 10px;
      /* La grille prend la plus petite de ces 3 tailles :
         - la largeur de l'écran moins les marges
         - la hauteur de l'écran moins la place du titre, des infos et du bouton
         - 520 px maximum (pour les tablettes) */
      width: min(100%, 100vh - 260px, 520px);  /* pour les vieux navigateurs */
      width: min(100%, 100dvh - 260px, 520px);
    }

    /* ===== Une carte ===== */
    .carte {
      aspect-ratio: 1 / 1;      /* carte bien carrée */
      perspective: 600px;       /* donne l'effet 3D au retournement */
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* La partie qui tourne (elle contient le dos et la face) */
    .carte-interieur {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }

    /* Quand la carte a la classe "retournee", on la fait pivoter */
    .carte.retournee .carte-interieur {
      transform: rotateY(180deg);
    }

    /* Le dos et la face sont l'un sur l'autre */
    .dos, .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;          /* on ne voit pas l'arrière */
      -webkit-backface-visibility: hidden;
      border: 3px solid var(--blanc);
      box-shadow: 0 4px 10px rgba(30, 110, 180, 0.3);
    }

    /* Dos de la carte : dégradé bleu avec des petits pois */
    .dos {
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.35) 2px, transparent 2.5px),
        linear-gradient(135deg, #4fc3f7, #1e6fc7);
      background-size: 14px 14px, 100% 100%;
    }

    /* Les bulles blanches au milieu du dos */
    .dos svg {
      width: 42%;
      height: 42%;
    }

    /* Face de la carte (avec le dessin) */
    .face {
      transform: rotateY(180deg);
      padding: 6%;
    }

    .face svg {
      width: 100%;
      height: 100%;
    }

    /* Carte trouvée : contour rose et petit saut de joie */
    .carte.trouvee .face {
      border-color: var(--rose);
      animation: saut 0.5s ease 0.45s;
    }

    @keyframes saut {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50%      { transform: rotateY(180deg) scale(1.12); }
    }

    /* ===== Boutons ===== */
    .bouton {
      margin-top: 14px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: bold;
      padding: 14px 34px;
      border: 3px solid var(--blanc);
      border-radius: 30px;
      background: linear-gradient(135deg, #2ec4b6, var(--violet));  /* turquoise -> bleu */
      color: var(--blanc);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(30, 110, 180, 0.4);
    }

    .bouton:active {
      transform: scale(0.95);
    }

    /* ===== Barre du bas : choix du mode + bouton Rejouer ===== */
    .commandes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .commandes .bouton {
      margin-top: 0;
      padding: 12px 24px;
    }

    /* Les deux boutons "Petit" / "Grand" collés l'un à l'autre */
    .modes {
      display: flex;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid var(--blanc);
      border-radius: 30px;
      padding: 3px;
      box-shadow: 0 3px 8px rgba(30, 110, 180, 0.2);
    }

    .mode {
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      min-height: 44px;            /* assez grand pour le doigt */
      padding: 0 16px;
      border: none;
      border-radius: 26px;
      background: none;
      color: var(--violet-fonce);
      cursor: pointer;
    }

    /* Le mode choisi est en bleu clair */
    .mode.actif {
      background: var(--bleu-clair);
      color: #1f5f99;
    }

    /* ===== Petit lien vers l'autre jeu ===== */
    .lien-jeu {
      color: #1f5f99;
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 14px;   /* zone assez grande pour le doigt */
    }

    /* ===== Fenêtre de victoire ===== */
    .victoire {
      position: fixed;
      inset: 0;
      background: rgba(11, 61, 99, 0.45);
      display: none;               /* cachée au départ */
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    /* Quand elle a la classe "visible", on l'affiche */
    .victoire.visible {
      display: flex;
    }

    .victoire-boite {
      background: var(--blanc);
      border: 4px solid var(--rose-clair);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      animation: apparition 0.4s ease;
    }

    @keyframes apparition {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .victoire-boite h2 {
      font-size: 1.7rem;
      margin-bottom: 12px;
      color: var(--rose);
    }

    .victoire-boite p {
      margin: 6px 0;
      font-size: 1.05rem;
    }

    .record {
      color: var(--violet);
      font-weight: bold;
    }

    /* ===== Confettis (petits cœurs et étoiles qui tombent) ===== */
    .confetti {
      position: fixed;
      top: -40px;
      font-size: 22px;
      pointer-events: none;   /* on peut toucher "à travers" */
      z-index: 20;
      animation: chute linear forwards;
    }

    @keyframes chute {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    /* Si le téléphone demande moins d'animations, on les coupe */
    @media (prefers-reduced-motion: reduce) {
      .carte-interieur { transition: none; }
      .carte.trouvee .face, .victoire-boite { animation: none; }
      .confetti { display: none; }
    }
  </style>
</head>
<body>

  <h1>
    <span class="t-rose">Memory</span>
    <span class="t-bleu">de la</span>
    <span class="t-violet">Mer</span>
  </h1>

  <!-- Compteur de coups, chrono et meilleur score -->
  <div class="infos">
    <div class="info">Coups<strong id="coups">0</strong></div>
    <div class="info">Temps<strong id="temps">0:00</strong></div>
    <div class="info">Record<strong id="record">–</strong></div>
    <button class="bouton-son" id="bouton-son" aria-label="Couper le son">🔔</button>
  </div>

  <!-- Les cartes seront ajoutées ici par le JavaScript -->
  <div class="plateau" id="plateau"></div>

  <!-- Choix du mode et bouton Rejouer -->
  <div class="commandes">
    <div class="modes">
      <button class="mode" data-mode="petit">Petit</button>
      <button class="mode" data-mode="grand">Grand</button>
    </div>
    <button class="bouton" id="rejouer">Rejouer</button>
  </div>

  <!-- Lien vers l'autre jeu -->
  <a class="lien-jeu" href="index.html">💜 Jouer au Memory de Myrtille</a>

  <!-- Fenêtre qui s'affiche quand on a gagné -->
  <div class="victoire" id="victoire">
    <div class="victoire-boite">
      <h2>🎉 Bravo !</h2>
      <p id="resultat"></p>
      <p id="message-record"></p>
      <button class="bouton" id="rejouer-victoire">Rejouer</button>
    </div>
  </div>

  <script>
    // ===================================================================
    // 1. LES DESSINS DES CARTES
    // Chaque dessin est une image "SVG" : des formes simples (cercles,
    // ellipses, traits) décrites dans une boîte de 100 x 100.
    // ===================================================================

    // Petite étoile scintillante, réutilisée sur plusieurs cartes
    function etincelle(x, y, taille, couleur) {
      const t = taille;
      return '<path d="M' + x + ' ' + (y - t) +
        ' Q' + x + ' ' + y + ' ' + (x + t) + ' ' + y +
        ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + t) +
        ' Q' + x + ' ' + y + ' ' + (x - t) + ' ' + y +
        ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - t) + 'Z" fill="' + couleur + '"/>';
    }

    // Astuce de dessin : on dessine les formes une 1re fois en foncé et
    // un peu plus grosses (le contour), puis une 2e fois par-dessus en clair.
    // Résultat : un seul joli contour autour de tout le personnage.
    function avecContour(formes, couleur, contour) {
      return '<g fill="' + contour + '" stroke="' + contour + '" stroke-width="5" stroke-linejoin="round">' + formes + '</g>' +
             '<g fill="' + couleur + '">' + formes + '</g>';
    }

    // Un œil avec un petit reflet blanc
    function oeil(x, y, taille) {
      return '<circle cx="' + x + '" cy="' + y + '" r="' + taille + '" fill="#1d2b4a"/>' +
             '<circle cx="' + (x + taille * 0.35) + '" cy="' + (y - taille * 0.35) + '" r="' + (taille * 0.35) + '" fill="#fff"/>';
    }

    // Un gros œil de poisson (blanc avec la pupille dedans)
    function oeilPoisson(x, y, taille) {
      return '<circle cx="' + x + '" cy="' + y + '" r="' + taille + '" fill="#fff" stroke="#1d2b4a" stroke-width="1.5"/>' +
             oeil(x + 1, y, taille * 0.6);
    }

    // Un petit sourire
    function sourire(x, y, largeur) {
      return '<path d="M' + (x - largeur / 2) + ' ' + y + ' q' + (largeur / 2) + ' ' + (largeur * 0.45) + ' ' + largeur + ' 0" ' +
             'stroke="#1d2b4a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    }

    // La liste des 8 cartes du jeu.
    // - id : un nom unique pour reconnaître les paires
    // - nom : ce qui est lu à voix haute par le téléphone (accessibilité)
    // - fond : la couleur pastel de la face de la carte
    // - dessin : l'image SVG
    const CARTES = [
      {
        id: "hippocampe", nom: "Un hippocampe", fond: "#fff3d6",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La queue enroulée (un gros trait foncé, puis un trait clair dessus)
          '<path d="M44 64 Q38 84 52 87 Q63 88 62 79 Q61 72 54 75" stroke="#e08a1e" stroke-width="13" fill="none" stroke-linecap="round"/>' +
          '<path d="M44 64 Q38 84 52 87 Q63 88 62 79 Q61 72 54 75" stroke="#ffb547" stroke-width="8" fill="none" stroke-linecap="round"/>' +
          // La nageoire du dos
          '<path d="M34 39 Q12 50 30 65 Z" fill="#ffe08a" stroke="#e08a1e" stroke-width="2" stroke-linejoin="round"/>' +
          // Le corps, la tête, le museau et la petite couronne
          avecContour(
            '<ellipse cx="45" cy="50" rx="14" ry="19" transform="rotate(-12 45 50)"/>' +
            '<ellipse cx="52" cy="25" rx="13" ry="11"/>' +
            '<ellipse cx="68" cy="29" rx="10" ry="4.5" transform="rotate(14 68 29)"/>' +
            '<path d="M44 16 L46 7 L50 14 L54 6 L57 15 Z"/>',
            "#ffb547", "#e08a1e") +
          // Le ventre clair avec ses rayures
          '<ellipse cx="51" cy="52" rx="7" ry="13" fill="#ffe08a" transform="rotate(-12 51 52)"/>' +
          '<path d="M46 44 h10 M45 50 h11 M45 56 h10 M45 62 h8" stroke="#e8a443" stroke-width="1.6" stroke-linecap="round"/>' +
          oeil(55, 22, 3.5) +
          '<ellipse cx="52" cy="31" rx="4" ry="2.5" fill="#ff8fa3" opacity="0.6"/>' +
          '</svg>'
      },
      {
        id: "clown", nom: "Un poisson clown", fond: "#ffe8dc",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La queue et les nageoires (orange bordé de noir)
          '<path d="M22 52 L6 37 Q11 52 6 67 Z" fill="#ff7a1a" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M36 34 Q50 20 64 34 Z" fill="#ff7a1a" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M42 70 Q50 82 58 70 Z" fill="#ff7a1a" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>' +
          // Le corps
          '<ellipse cx="48" cy="52" rx="30" ry="20" fill="#ff7a1a" stroke="#2b2b2b" stroke-width="2"/>' +
          // Les deux bandes blanches
          '<ellipse cx="38" cy="52" rx="5" ry="18.5" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>' +
          '<ellipse cx="59" cy="52" rx="4.5" ry="17.5" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>' +
          oeilPoisson(68, 47, 5.5) +
          sourire(73, 58, 7) +

      },
      {
        id: "etoile", nom: "Une étoile de mer", fond: "#ffe3ea",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Une étoile à 5 branches aux bouts arrondis
          '<polygon points="50,18 60,40.3 84.2,42.9 66.2,59.3 71.2,83.1 50,71 28.8,83.1 33.8,59.3 15.8,42.9 40,40.3" ' +
          'fill="#ff8fa3" stroke="#e5647d" stroke-width="7" stroke-linejoin="round"/>' +
          // Les petits points sur l'étoile
          '<circle cx="50" cy="30" r="2" fill="#ffd0da"/><circle cx="74" cy="46" r="2" fill="#ffd0da"/>' +
          '<circle cx="66" cy="73" r="2" fill="#ffd0da"/><circle cx="34" cy="73" r="2" fill="#ffd0da"/>' +
          '<circle cx="26" cy="46" r="2" fill="#ffd0da"/>' +
          oeil(44, 52, 3.2) + oeil(56, 52, 3.2) +
          sourire(50, 60, 9) +
          '</svg>'
      },
      {
        id: "saint-jacques", nom: "Une coquille Saint-Jacques", fond: "#fff6dc",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Les deux petites "oreilles" en bas de la coquille
          '<path d="M38 78 L28 90 L50 87 L72 90 L62 78 Z" fill="#ffc35a" stroke="#d98f1f" stroke-width="2.5" stroke-linejoin="round"/>' +
          // L'éventail de la coquille
          '<path d="M50 84 L14 44 Q16 16 50 12 Q84 16 86 44 Z" fill="#ffd27a" stroke="#d98f1f" stroke-width="2.5" stroke-linejoin="round"/>' +
          // Les rayures qui partent du bas
          '<path d="M50 84 L22 32 M50 84 L34 19 M50 84 L50 14 M50 84 L66 19 M50 84 L78 32" stroke="#e3a33a" stroke-width="2.5" stroke-linecap="round"/>' +
          // Une perle rose
          '<circle cx="50" cy="56" r="7" fill="#ffd6ec" stroke="#ff8fc7" stroke-width="2"/>' +
          '<circle cx="48" cy="54" r="2" fill="#fff"/>' +
          '</svg>'
      },
      {
        id: "chirurgien", nom: "Un poisson chirurgien bleu", fond: "#e0f0ff",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La queue jaune
          '<path d="M22 52 L6 36 Q11 52 6 68 Z" fill="#ffd23f" stroke="#1d2b4a" stroke-width="2" stroke-linejoin="round"/>' +
          // Le corps bleu
          '<ellipse cx="50" cy="52" rx="30" ry="22" fill="#2f6fe0" stroke="#1d2b4a" stroke-width="2"/>' +
          // La grande tache foncée sur le dos
          '<path d="M27 46 Q46 30 70 40 Q60 46 52 44 Q44 58 31 60 Q38 51 27 46 Z" fill="#13235a"/>' +
          // La petite nageoire jaune
          '<path d="M56 58 Q64 70 70 60 Z" fill="#ffd23f" stroke="#1d2b4a" stroke-width="1.5" stroke-linejoin="round"/>' +
          oeilPoisson(70, 47, 6.5) +
          sourire(74, 60, 7) +
          '</svg>'
      },
      {
        id: "sirene", nom: "Une sirène", fond: "#f0e4ff",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Les longs cheveux (derrière la tête)
          '<path d="M35 27 Q34 9 50 10 Q67 9 66 28 Q71 46 61 52 L39 52 Q29 45 35 27 Z" fill="#ff5a3c"/>' +
          // La queue de poisson et ses nageoires
          '<path d="M52 79 Q40 94 32 86 Q42 84 52 79 Z" fill="#2ec4b6" stroke="#1a9488" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M52 79 Q64 95 72 86 Q62 84 52 79 Z" fill="#2ec4b6" stroke="#1a9488" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M41 53 L59 53 Q62 70 54 80 L50 82 Q43 70 41 53 Z" fill="#2ec4b6" stroke="#1a9488" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M45 62 q5 3 10 0 M46 70 q4 3 8 0" stroke="#1a9488" stroke-width="1.5" fill="none" stroke-linecap="round"/>' +
          // Les bras et le buste
          '<path d="M43 44 Q34 50 36 58 M57 44 Q66 50 64 58" stroke="#ffd9c2" stroke-width="4" fill="none" stroke-linecap="round"/>' +
          '<ellipse cx="50" cy="46" rx="8" ry="9" fill="#ffd9c2"/>' +
          // Le haut en coquillages
          '<circle cx="46" cy="45" r="3.5" fill="#ff8fc7"/><circle cx="54" cy="45" r="3.5" fill="#ff8fc7"/>' +
          // La tête et la frange
          '<circle cx="50" cy="26" r="11" fill="#ffd9c2"/>' +
          '<path d="M39 25 Q42 13 52 14 Q62 15 61 24 Q55 18 47 21 Q43 23 39 25 Z" fill="#ff5a3c"/>' +
          oeil(46, 27, 2.2) + oeil(54, 27, 2.2) +
          sourire(50, 32, 6) +
          '<ellipse cx="43" cy="31" rx="2.5" ry="1.5" fill="#ff8fa3" opacity="0.7"/>' +
          '<ellipse cx="57" cy="31" rx="2.5" ry="1.5" fill="#ff8fa3" opacity="0.7"/>' +
          '</svg>'
      },
      {
        id: "jaune", nom: "Un poisson jaune à rayures bleues", fond: "#fff9d6",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // La queue et la nageoire du dos (bleues)
          '<path d="M24 52 L7 38 Q13 52 7 66 Z" fill="#2f8fe0" stroke="#1d5fa8" stroke-width="2" stroke-linejoin="round"/>' +
          '<path d="M36 32 Q50 14 64 32 Z" fill="#2f8fe0" stroke="#1d5fa8" stroke-width="2" stroke-linejoin="round"/>' +
          // Le corps tout rond
          '<ellipse cx="50" cy="53" rx="28" ry="25" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>' +
          // Les rayures bleues
          '<path d="M40 32 Q45 44 40 56" stroke="#2f8fe0" stroke-width="6" fill="none" stroke-linecap="round"/>' +
          '<path d="M54 30 Q59 42 54 54" stroke="#2f8fe0" stroke-width="6" fill="none" stroke-linecap="round"/>' +
          oeilPoisson(66, 47, 6.5) +
          sourire(70, 61, 8) +
          '<ellipse cx="60" cy="58" rx="4" ry="2.5" fill="#ff8fa3" opacity="0.6"/>' +
          '</svg>'
      },
      {
        id: "trident", nom: "Le trident de Poséidon", fond: "#e3f6ff",
        dessin:
          '<svg viewBox="0 0 100 100">' +
          // Le trident est dessiné 2 fois : en foncé (contour) puis en doré
          '<g stroke="#c48a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
          '<path d="M30 22 L30 36 Q30 48 50 48 Q70 48 70 36 L70 22 M50 14 L50 90"/></g>' +
          '<g stroke="#ffc83d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
          '<path d="M30 22 L30 36 Q30 48 50 48 Q70 48 70 36 L70 22 M50 14 L50 90"/></g>' +
          // Les trois pointes
          '<path d="M24 25 L30 8 L36 25 Z M44 17 L50 2 L56 17 Z M64 25 L70 8 L76 25 Z" fill="#ffc83d" stroke="#c48a0a" stroke-width="2.5" stroke-linejoin="round"/>' +
          // La pierre précieuse
          '<circle cx="50" cy="49" r="5" fill="#2ec4b6" stroke="#c48a0a" stroke-width="2"/>' +
          '<circle cx="48.5" cy="47.5" r="1.5" fill="#fff"/>' +
          etincelle(18, 60, 6, "#2f8fe0") +
          etincelle(82, 66, 5, "#2ec4b6") +
          '</svg>'
      }
    ];

    // Les petites bulles blanches dessinées au dos de chaque carte
    const DESSIN_DOS =
      '<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" opacity="0.9">' +
      '<circle cx="42" cy="58" r="22"/><circle cx="72" cy="30" r="12"/><circle cx="76" cy="62" r="6"/>' +
      '</svg>';

    // Noms utilisés pour ranger les infos dans la mémoire du téléphone
    const CLE_RECORD = "memory-mer-record";   // meilleur score
    const CLE_MODE = "memory-mer-mode";       // dernier mode choisi
    const CLE_SON = "memory-mer-son";         // son activé ou non

    // Les deux modes de jeu : le nombre de paires sur le plateau
    // Petit = 6 paires (12 cartes), Grand = 8 paires (16 cartes)
    const MODES = { petit: 6, grand: 8 };

    // ===================================================================
    // 2. On récupère les éléments de la page
    // ===================================================================
    const plateau = document.getElementById("plateau");
    const affichageCoups = document.getElementById("coups");
    const affichageTemps = document.getElementById("temps");
    const affichageRecord = document.getElementById("record");
    const fenetreVictoire = document.getElementById("victoire");
    const texteResultat = document.getElementById("resultat");
    const texteRecord = document.getElementById("message-record");

    // ===================================================================
    // 3. Les variables qui changent pendant la partie
    // ===================================================================
    let premiereCarte = null;   // la 1re carte retournée
    let deuxiemeCarte = null;   // la 2e carte retournée
    let bloque = false;         // true = on attend, on ne peut pas toucher
    let coups = 0;              // nombre de coups joués
    let pairesTrouvees = 0;     // nombre de paires trouvées
    let secondes = 0;           // temps écoulé
    let chrono = null;          // le minuteur (null = arrêté)
    let attente = null;         // le délai en cours (retournement ou victoire)
    let nombrePaires = 8;       // nombre de paires de la partie en cours

    // ===================================================================
    // 4. Mélanger un tableau (méthode de Fisher-Yates)
    // On parcourt le tableau de la fin vers le début
    // et on échange chaque case avec une case au hasard avant elle.
    // ===================================================================
    function melanger(tableau) {
      for (let i = tableau.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
      }
      return tableau;
    }

    // ===================================================================
    // 5. Transformer des secondes en texte "m:ss"
    // ===================================================================
    function formaterTemps(total) {
      const minutes = Math.floor(total / 60);
      const sec = total % 60;
      // padStart ajoute un 0 devant si besoin (ex : 5 -> "05")
      return minutes + ":" + String(sec).padStart(2, "0");
    }

    // ===================================================================
    // 6. La mémoire du téléphone (record, mode, son)
    // On utilise "localStorage" : une petite mémoire du navigateur
    // qui reste sur le téléphone même après fermeture.
    // try/catch évite que le jeu plante si cette mémoire est bloquée.
    // ===================================================================
    function lireMemoire(cle) {
      try {
        return localStorage.getItem(cle);
      } catch (e) {
        return null;
      }
    }

    function ecrireMemoire(cle, valeur) {
      try {
        localStorage.setItem(cle, valeur);
      } catch (e) {
        // Pas grave : l'info ne sera simplement pas gardée
      }
    }

    // On reprend le dernier mode choisi (Grand si rien n'est enregistré)
    let mode = lireMemoire(CLE_MODE) === "petit" ? "petit" : "grand";

    // Chaque mode a son propre record
    function cleRecord() {
      return mode === "grand" ? CLE_RECORD : CLE_RECORD + "-petit";
    }

    function lireRecord() {
      const texte = lireMemoire(cleRecord());
      try {
        return texte ? JSON.parse(texte) : null;
      } catch (e) {
        return null;
      }
    }

    function sauverRecord(record) {
      ecrireMemoire(cleRecord(), JSON.stringify(record));
    }

    function afficherRecord() {
      const record = lireRecord();
      if (record) {
        affichageRecord.textContent = record.coups + " coups";
      } else {
        affichageRecord.textContent = "–";
      }
    }

    // ===================================================================
    // 7. Le chronomètre
    // ===================================================================
    function demarrerChrono() {
      // setInterval lance une fonction toutes les 1000 ms (= 1 seconde)
      chrono = setInterval(function () {
        secondes++;
        affichageTemps.textContent = formaterTemps(secondes);
      }, 1000);
    }

    function arreterChrono() {
      clearInterval(chrono);
      chrono = null;
    }

    // ===================================================================
    // 7 bis. Les sons de bulles
    // Aucun fichier son : le téléphone fabrique lui-même les notes
    // grâce à "Web Audio" (un petit synthétiseur intégré au navigateur).
    // ===================================================================
    let audio = null;                              // le synthétiseur
    let sonActif = lireMemoire(CLE_SON) !== "non"; // son activé par défaut
    const boutonSon = document.getElementById("bouton-son");

    // Le synthétiseur ne peut démarrer qu'après un toucher de l'écran :
    // on le prépare donc au premier toucher de carte.
    function preparerAudio() {
      if (audio === null) {
        const Synthe = window.AudioContext || window.webkitAudioContext;
        if (!Synthe) {
          return null;   // navigateur trop ancien : on joue sans son
        }
        audio = new Synthe();
      }
      if (audio.state === "suspended") {
        audio.resume();
      }
      return audio;
    }

    // Joue UNE bulle : un son qui monte très vite puis s'éteint ("bloup").
    // - frequence : la hauteur de départ (plus c'est grand, plus c'est aigu)
    // - debut : dans combien de secondes la bulle éclate
    // - volume : de 0 (muet) à 1 (très fort)
    function bulle(frequence, debut, volume) {
      const t = audio.currentTime + debut;
      const oscillateur = audio.createOscillator();  // fabrique le son
      const gain = audio.createGain();               // règle le volume
      oscillateur.type = "sine";
      // La hauteur grimpe en 0,1 seconde : c'est ça qui fait "bulle"
      oscillateur.frequency.setValueAtTime(frequence, t);
      oscillateur.frequency.exponentialRampToValueAtTime(frequence * 2.6, t + 0.1);
      // Le volume monte d'un coup puis retombe vite
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      oscillateur.connect(gain);
      gain.connect(audio.destination);               // vers le haut-parleur
      oscillateur.start(t);
      oscillateur.stop(t + 0.2);
    }

    // Paire trouvée : 3 bulles de plus en plus aiguës
    function sonPaire() {
      if (!sonActif || !preparerAudio()) return;
      [380, 500, 650].forEach(function (frequence, i) {
        bulle(frequence, i * 0.09, 0.35);
      });
    }

    // Victoire : une remontée de bulles, puis un dernier "plop" bien aigu
    function sonVictoire() {
      if (!sonActif || !preparerAudio()) return;
      [300, 420, 360, 520, 460, 640, 580, 780, 700, 900].forEach(function (frequence, i) {
        bulle(frequence, i * 0.08, 0.3);
      });
      bulle(1100, 1, 0.35);
    }

    // Le bouton du son (🔔) : couper ou remettre le son
    function afficherBoutonSon() {
      boutonSon.textContent = sonActif ? "🔔" : "🔕";
      boutonSon.setAttribute("aria-label", sonActif ? "Couper le son" : "Remettre le son");
    }

    boutonSon.addEventListener("click", function () {
      sonActif = !sonActif;
      ecrireMemoire(CLE_SON, sonActif ? "oui" : "non");
      afficherBoutonSon();
      sonPaire();   // petit son pour confirmer que c'est remis
    });

    afficherBoutonSon();

    // ===================================================================
    // 8. Créer une nouvelle partie
    // ===================================================================
    function nouvellePartie() {
      // On remet tout à zéro
      arreterChrono();
      clearTimeout(attente);    // annule un retournement encore en attente
      premiereCarte = null;
      deuxiemeCarte = null;
      bloque = false;
      coups = 0;
      pairesTrouvees = 0;
      secondes = 0;
      affichageCoups.textContent = "0";
      affichageTemps.textContent = "0:00";
      fenetreVictoire.classList.remove("visible");
      // On enlève les confettis qui tomberaient encore
      document.querySelectorAll(".confetti").forEach(function (c) { c.remove(); });
      afficherRecord();

      // On allume le bouton du mode choisi (Petit ou Grand)
      document.querySelectorAll(".mode").forEach(function (bouton) {
        bouton.classList.toggle("actif", bouton.dataset.mode === mode);
      });

      // On tire au hasard les dessins de la partie
      // (en mode Petit, 6 dessins sur les 8)
      nombrePaires = MODES[mode];
      const choix = melanger([...CARTES]).slice(0, nombrePaires);

      // On double la liste des cartes (pour faire les paires) et on mélange
      const paquet = melanger([...choix, ...choix]);

      // On vide le plateau puis on crée les 16 cartes
      plateau.innerHTML = "";
      paquet.forEach(function (modele) {
        const carte = document.createElement("button");
        carte.className = "carte";
        carte.dataset.id = modele.id;   // on garde l'identité "cachée" dans la carte
        carte.dataset.nom = modele.nom;
        carte.setAttribute("aria-label", "Carte cachée");
        carte.innerHTML =
          '<div class="carte-interieur">' +
            '<div class="dos">' + DESSIN_DOS + '</div>' +
            '<div class="face" style="background:' + modele.fond + '">' + modele.dessin + '</div>' +
          '</div>';
        carte.addEventListener("click", function () {
          toucherCarte(carte);
        });
        plateau.appendChild(carte);
      });
    }

    // ===================================================================
    // 9. Quand on touche une carte
    // ===================================================================
    function toucherCarte(carte) {
      // On ignore le toucher si :
      // - on attend que deux cartes se retournent
      // - la carte est déjà retournée ou déjà trouvée
      if (bloque || carte.classList.contains("retournee")) {
        return;
      }

      // On réveille le synthétiseur (il a besoin d'un toucher pour démarrer)
      if (sonActif) {
        preparerAudio();
      }

      // Le chrono démarre au tout premier toucher
      if (chrono === null && secondes === 0) {
        demarrerChrono();
      }

      // On retourne la carte (le CSS fait l'animation)
      carte.classList.add("retournee");
      carte.setAttribute("aria-label", carte.dataset.nom);

      if (premiereCarte === null) {
        // C'est la 1re carte du coup : on la garde en mémoire
        premiereCarte = carte;
        return;
      }

      // C'est la 2e carte : un coup est terminé
      deuxiemeCarte = carte;
      coups++;
      affichageCoups.textContent = coups;

      if (premiereCarte.dataset.id === deuxiemeCarte.dataset.id) {
        // Les deux cartes sont identiques : elles restent visibles
        premiereCarte.classList.add("trouvee");
        deuxiemeCarte.classList.add("trouvee");
        pairesTrouvees++;
        premiereCarte = null;
        deuxiemeCarte = null;

        // Toutes les paires trouvées ? C'est gagné !
        if (pairesTrouvees === nombrePaires) {
          sonVictoire();
          victoire();
        } else {
          sonPaire();
        }
      } else {
        // Pas identiques : on bloque, puis on les retourne après 1 seconde
        bloque = true;
        attente = setTimeout(function () {
          premiereCarte.classList.remove("retournee");
          deuxiemeCarte.classList.remove("retournee");
          premiereCarte.setAttribute("aria-label", "Carte cachée");
          deuxiemeCarte.setAttribute("aria-label", "Carte cachée");
          premiereCarte = null;
          deuxiemeCarte = null;
          bloque = false;
        }, 1000);
      }
    }

    // ===================================================================
    // 10. Pluie de confettis (coquillages, poissons, étoiles) quand on gagne
    // ===================================================================
    function lancerConfettis() {
      const symboles = ["🐚", "🐠", "💙", "⭐", "✨"];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement("span");
        c.className = "confetti";
        c.textContent = symboles[i % symboles.length];
        c.style.left = Math.random() * 100 + "vw";                 // position au hasard
        c.style.animationDuration = 2 + Math.random() * 2 + "s";   // vitesse au hasard
        c.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(c);
        // On l'enlève de la page quand il a fini de tomber
        c.addEventListener("animationend", function () { c.remove(); });
      }
    }

    // ===================================================================
    // 11. Fin de partie
    // ===================================================================
    function victoire() {
      arreterChrono();

      texteResultat.textContent =
        "Gagné en " + coups + " coups et " + formaterTemps(secondes) + ".";

      // Meilleur score = le moins de coups.
      // En cas d'égalité, le temps le plus court gagne.
      const ancien = lireRecord();
      const nouveauRecord =
        ancien === null ||
        coups < ancien.coups ||
        (coups === ancien.coups && secondes < ancien.secondes);

      if (nouveauRecord) {
        sauverRecord({ coups: coups, secondes: secondes });
        texteRecord.innerHTML = '<span class="record">🏆 Nouveau record !</span>';
      } else {
        texteRecord.textContent =
          "Record : " + ancien.coups + " coups en " + formaterTemps(ancien.secondes);
      }

      afficherRecord();

      // Petite pause pour laisser finir l'animation de la dernière carte
      attente = setTimeout(function () {
        fenetreVictoire.classList.add("visible");
        lancerConfettis();
      }, 800);
    }

    // ===================================================================
    // 12. Les boutons "Rejouer"
    // ===================================================================
    document.getElementById("rejouer").addEventListener("click", nouvellePartie);
    document.getElementById("rejouer-victoire").addEventListener("click", nouvellePartie);

    // Les boutons "Petit" et "Grand" : on change de mode et on relance
    document.querySelectorAll(".mode").forEach(function (bouton) {
      bouton.addEventListener("click", function () {
        mode = bouton.dataset.mode;
        ecrireMemoire(CLE_MODE, mode);
        nouvellePartie();
      });
    });

    // ===================================================================
    // 13. On lance la première partie au chargement de la page
    // ===================================================================
    nouvellePartie();
  </script>
</body>
</html>
