<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Cette ligne adapte la page à la largeur du téléphone (pas besoin de zoomer).
       On interdit aussi le zoom à deux doigts. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffc2e2">
  <title>Les Memory de Myrtille</title>

  <!-- Pour installer le jeu comme une appli sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memory">

  <style>
    /* ===== Réglages généraux ===== */
    * {
      box-sizing: border-box;   /* les tailles incluent les bordures */
      margin: 0;
      padding: 0;
    }

    body {
      /* Police arrondie, plus douce pour les enfants */
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      /* Fond dégradé rose -> bleu clair -> violet clair */
      background: linear-gradient(160deg, #ffd6ec 0%, #d9efff 50%, #e7dcff 100%);
      color: #5b3a8c;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Titre ===== */
    h1 {
      font-size: 1.8rem;
      text-align: center;
      line-height: 1.15;
      margin: 6px 0 14px;
      padding: 0 56px;   /* laisse la place au bouton de la musique */
    }

    .t-rose   { color: #ff6fb5; }
    .t-bleu   { color: #3aa0e8; }
    .t-violet { color: #9b6bff; }

    /* ===== Le choix de la taille de partie : chenille ou papillon ===== */
    .tailles {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.6);
      border: 3px solid #fff;
      border-radius: 30px;
      padding: 4px;
      margin-bottom: 14px;
      box-shadow: 0 3px 8px rgba(155, 107, 255, 0.2);
    }

    .taille {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: bold;
      color: #5b3a8c;
      border: none;
      border-radius: 24px;
      background: none;
      padding: 8px 16px;
      min-height: 48px;           /* assez grand pour un petit doigt */
      cursor: pointer;
    }

    /* Le grand dessin du bouton (elle ne lit pas encore) */
    .taille span {
      font-size: 1.6rem;
      vertical-align: middle;
      margin-right: 4px;
    }

    /* La taille choisie est mise en avant */
    .taille.choisie {
      background: #fff;
      box-shadow: 0 2px 6px rgba(155, 107, 255, 0.35);
    }

    /* ===== La grille des univers : 2 colonnes ===== */
    .mondes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 460px;
    }

    /* Une tuile par univers : on la touche pour lancer le jeu */
    .monde {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 8px 12px;
      border: 4px solid #fff;
      border-radius: 24px;
      text-decoration: none;
      box-shadow: 0 5px 14px rgba(155, 107, 255, 0.25);
    }

    .monde:active {
      transform: scale(0.96);
    }

    /* Le personnage de l'univers, qui se dandine doucement */
    .monde svg {
      /* taille qui s'adapte à la largeur ET à la hauteur de l'écran */
      width: min(26vw, 100px, 11.5vh);
      height: min(26vw, 100px, 11.5vh);
      background: #fff;
      border-radius: 20px;
      padding: 6px;
      animation: dandiner 1.6s ease-in-out infinite alternate;
    }

    @keyframes dandiner {
      from { transform: rotate(-5deg) translateY(0); }
      to   { transform: rotate(5deg) translateY(-4px); }
    }

    .monde strong {
      font-size: 1.15rem;
      text-align: center;
    }

    /* ===== Installer l'appli ===== */
    .installer {
      margin-top: 18px;
      text-align: center;
      max-width: 460px;
    }

    .bouton {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 28px;
      border: 3px solid #fff;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff6fb5, #9b6bff);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(155, 107, 255, 0.4);
    }

    .aide {
      font-size: 0.95rem;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 10px 14px;
    }

    /* Ces éléments sont cachés tant que le JavaScript ne les montre pas */
    .cache {
      display: none;
    }

    /* ===== Le bouton rond de la musique, en haut à droite ===== */
    .rond {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: rgba(255, 255, 255, 0.8);
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      z-index: 5;
      -webkit-touch-callout: none;   /* pas de menu du téléphone */
    }

    .rond.eteint {
      opacity: 0.55;
    }

    /* L'anneau qui se remplit pendant l'appui long (voir appui.js) */
    @property --remplissage {
      syntax: "<percentage>";
      inherits: false;
      initial-value: 0%;
    }

    .rond::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(#9b6bff var(--remplissage), transparent 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      opacity: 0;
      pointer-events: none;
    }

    .rond.appui::after {
      opacity: 1;
      animation: remplir 1s linear forwards;
    }

    @keyframes remplir {
      from { --remplissage: 0%; }
      to   { --remplissage: 100%; }
    }

    /* Un toucher trop court : le bouton se secoue un peu */
    .rond.refus {
      animation: refus 0.4s ease;
    }

    @keyframes refus {
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* ===== Le décor qui flotte doucement derrière ===== */
    .decor {
      position: fixed;
      inset: 0;
      z-index: -1;            /* derrière tout le reste */
      overflow: hidden;
      pointer-events: none;   /* on ne peut pas le toucher */
    }

    .decor span {
      position: absolute;
      bottom: -60px;
      opacity: 0.35;
      animation: flotter linear infinite;
    }

    @keyframes flotter {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(-115vh) rotate(25deg); }
    }

    /* Si le téléphone demande moins d'animations, on les coupe */
    @media (prefers-reduced-motion: reduce) {
      .monde svg, .decor span { animation: none; }
    }

    /* Petits écrans (pas très hauts) : tout est un peu plus serré
       pour que les 6 univers tiennent sans faire défiler */
    @media (max-height: 640px) {
      h1 { font-size: 1.45rem; margin: 2px 0 8px; }
      .tailles { margin-bottom: 8px; }
      .taille { min-height: 44px; padding: 4px 12px; font-size: 0.95rem; }
      .taille span { font-size: 1.35rem; }
      .mondes { gap: 8px; }
      .monde { padding: 6px 6px 8px; gap: 2px; }
      .monde strong { font-size: 1rem; }
      .monde svg { width: min(26vw, 10.5vh); height: min(26vw, 10.5vh); }
    }
  </style>
</head>
<body>

  <!-- Le décor animé (rempli par le JavaScript) -->
  <div class="decor" id="decor" aria-hidden="true"></div>

  <!-- Le bouton pour couper / remettre la musique -->
  <button class="rond" id="bouton-musique" aria-label="Couper la musique">🎵</button>

  <h1>
    <span class="t-rose">Les Memory</span><br>
    <span class="t-bleu">de</span>
    <span class="t-violet">Myrtille</span>
  </h1>

  <!-- La taille de partie : chenille (6 paires, grandes cartes)
       ou papillon (8 paires). Le téléphone s'en souvient. -->
  <div class="tailles" role="group" aria-label="Taille de la partie">
    <button class="taille" data-taille="chenille"><span>🐛</span>Chenille</button>
    <button class="taille" data-taille="papillon"><span>🦋</span>Papillon</button>
  </div>

  <!-- Les univers (une tuile par univers, créées par le JavaScript) -->
  <nav class="mondes" id="mondes"></nav>

  <!-- Installer le jeu comme une appli sur l'écran d'accueil -->
  <div class="installer">
    <!-- Bouton visible seulement si le téléphone sait installer tout seul (Android) -->
    <button class="bouton cache" id="bouton-installer">📲 Installer l'appli</button>
    <!-- Aide visible seulement sur iPhone / iPad -->
    <p class="aide cache" id="aide-iphone">
      📲 Pour installer l'appli : touche le bouton <strong>Partager</strong>
      (le carré avec une flèche), puis <strong>« Sur l'écran d'accueil »</strong>.
    </p>
  </div>

  <!-- La liste des univers, les outils de dessin et la musique -->
  <script src="mondes/outils.js"></script>
  <script src="appui.js"></script>
  <script src="musique.js"></script>
  <script>
    // ===== 1. Créer une tuile par univers =====
    // On charge les fichiers des univers un par un (dans l'ordre de la liste),
    // puis on fabrique les tuiles.
    function chargerUnivers(numero) {
      if (numero >= LISTE_MONDES.length) {
        creerTuiles();
        return;
      }
      const fichier = document.createElement("script");
      fichier.src = "mondes/" + LISTE_MONDES[numero] + ".js";
      fichier.onload = function () { chargerUnivers(numero + 1); };
      fichier.onerror = function () { chargerUnivers(numero + 1); };  // on saute un fichier manquant
      document.body.appendChild(fichier);
    }

    function creerTuiles() {
      const liste = document.getElementById("mondes");
      LISTE_MONDES.forEach(function (id, i) {
        const monde = MONDES[id];
        if (!monde) return;
        const tuile = document.createElement("a");
        tuile.className = "monde";
        tuile.href = "jeu.html?monde=" + id;
        tuile.style.background = monde.couleurs.fond;
        tuile.style.color = monde.couleurs.texte;
        // Le dessin du personnage de l'univers + son nom
        const personnage = monde.cartes.find(function (c) { return c.id === monde.mascotte; });
        tuile.innerHTML = personnage.dessin + "<strong>" + monde.nom + "</strong>";
        tuile.setAttribute("aria-label", "Jouer : " + monde.nom);
        // Chaque personnage se dandine à son rythme
        tuile.querySelector("svg").style.animationDelay = -i * 0.4 + "s";
        liste.appendChild(tuile);
      });
    }

    chargerUnivers(0);

    // ===== 1 bis. Chenille ou papillon ? =====
    // Le choix est gardé dans le téléphone ; le jeu le lit au démarrage.
    const CLE_TAILLE = "memory-taille";
    let tailleChoisie = "papillon";
    try {
      if (localStorage.getItem(CLE_TAILLE) === "chenille") tailleChoisie = "chenille";
    } catch (e) {}

    function afficherTaille() {
      document.querySelectorAll(".taille").forEach(function (bouton) {
        const choisie = bouton.dataset.taille === tailleChoisie;
        bouton.classList.toggle("choisie", choisie);
        bouton.setAttribute("aria-pressed", choisie ? "true" : "false");
      });
    }

    document.querySelectorAll(".taille").forEach(function (bouton) {
      bouton.addEventListener("click", function () {
        tailleChoisie = bouton.dataset.taille;
        try {
          localStorage.setItem(CLE_TAILLE, tailleChoisie);
        } catch (e) {}
        afficherTaille();
      });
    });
    afficherTaille();

    // ===== 2. Le mode appli : le jeu marche même sans internet =====
    // Le "service worker" est un petit programme qui garde une copie
    // des jeux dans le téléphone.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    // Est-ce qu'on est déjà dans l'appli installée ?
    const dejaInstalle =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    // ===== 3. Le bouton "Installer" (Android, ordinateur avec Chrome/Edge) =====
    // Le navigateur prévient quand l'installation est possible :
    // on garde sa demande de côté et on affiche notre bouton.
    let demandeInstallation = null;
    const boutonInstaller = document.getElementById("bouton-installer");

    window.addEventListener("beforeinstallprompt", function (evenement) {
      evenement.preventDefault();
      demandeInstallation = evenement;
      boutonInstaller.classList.remove("cache");
    });

    boutonInstaller.addEventListener("click", function () {
      if (demandeInstallation) {
        demandeInstallation.prompt();   // ouvre la fenêtre "Installer ?"
        demandeInstallation = null;
        boutonInstaller.classList.add("cache");
      }
    });

    // ===== 4. L'aide pour iPhone / iPad =====
    // Sur iPhone, il n'y a pas de bouton automatique : on explique comment faire.
    const estIphone = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (estIphone && !dejaInstalle) {
      document.getElementById("aide-iphone").classList.remove("cache");
    }

    // ===== 5. Le décor : des petits symboles des univers qui flottent =====
    const symboles = ["💜", "🐠", "🦕", "🐮", "🦁", "🦊", "⭐", "💖"];
    const decor = document.getElementById("decor");
    for (let i = 0; i < 12; i++) {
      const element = document.createElement("span");
      element.textContent = symboles[i % symboles.length];
      element.style.fontSize = 18 + Math.random() * 22 + "px";            // taille au hasard
      element.style.left = Math.random() * 95 + "vw";                      // position au hasard
      element.style.animationDuration = 14 + Math.random() * 12 + "s";    // lent
      element.style.animationDelay = -Math.random() * 20 + "s";           // déjà en route
      decor.appendChild(element);
    }

    // ===== 6. La musique de l'accueil : « La Marseillaise » =====
    initMusique(MELODIES.marseillaise, document.getElementById("bouton-musique"));
  </script>
</body>
</html>
